# Standalone host-side test harness for the mosey-session program. It is
# deliberately NOT linked to the program crate: it loads the compiled .so
# by path into an in-process SVM (litesvm) and builds instructions with
# plain solana-sdk. Keeping it separate means litesvm's Solana version is
# fully isolated from the program's anchor/solana-program build — no
# dependency unification, no leakage into the deployed program.
[package]
name = "mosey-session-litesvm"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
# Depend on the same granular solana crates litesvm uses (not solana-sdk),
# at litesvm's versions, so Address/Instruction/Transaction types unify
# across the boundary instead of resolving to two incompatible lines.
litesvm = "0.12"
solana-address = "2.6"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-instruction = "3.4"
solana-transaction = "3.0"
solana-system-interface = "3.2"
solana-account = "3.2"
sha2 = "0.10"
