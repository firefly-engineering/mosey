[package]
name = "mosey-session"
version = "0.1.0"
edition = "2021"
description = "On-chain session ownership + grant registry for mosey wallet auth"

[lib]
crate-type = ["cdylib", "lib"]
name = "mosey_session"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
