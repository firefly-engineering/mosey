<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mosey · web terminal</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1d1f21;
        color: #c5c8c6;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      }
      header {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        padding: 0.5rem 0.75rem;
        background: #282a2e;
        border-bottom: 1px solid #373b41;
        font-size: 0.85rem;
      }
      header button {
        font: inherit;
        padding: 0.3rem 0.6rem;
        border-radius: 4px;
        border: 1px solid #373b41;
        background: #1d1f21;
        color: inherit;
        cursor: pointer;
      }
      #status {
        margin-left: auto;
        color: #969896;
      }
      .err {
        color: #cc6666;
      }
      #terminal {
        height: calc(100vh - 44px);
        padding: 0.25rem;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>mosey</strong>
      <span id="session"></span>
      <span id="wallets"></span>
      <button id="grant" style="display: none">Grant access…</button>
      <span id="status">starting…</span>
    </header>
    <div id="terminal"></div>

    <script type="module">
      // The gateway does all libp2p + mosey-auth work. The browser is a
      // thin terminal over a WebSocket. In wallet-login mode it first runs
      // an inline signMessage flow (prepare → sign → callback) to authorize
      // the gateway, then opens the socket with the resulting token.
      const { Terminal } = await import(
        "https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/+esm"
      );
      const { FitAddon } = await import(
        "https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/+esm"
      );

      const statusEl = document.getElementById("status");
      const setStatus = (s, cls) => {
        statusEl.textContent = s;
        statusEl.className = cls || "";
      };

      // Connected wallet context, captured at attach for the grant op.
      let active = { provider: null, addr: null, session: null };

      // --- base58 (matches wallet signMessage return / Go EncodeBase58)
      const ALPHABET =
        "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
      const b58 = (bytes) => {
        let n = 0n;
        for (const b of bytes) n = n * 256n + BigInt(b);
        let o = "";
        while (n > 0n) {
          o = ALPHABET[Number(n % 58n)] + o;
          n /= 58n;
        }
        for (const b of bytes) {
          if (b !== 0) break;
          o = "1" + o;
        }
        return o || "1";
      };
      const hexToBytes = (h) => {
        const a = new Uint8Array(h.length / 2);
        for (let i = 0; i < a.length; i++)
          a[i] = parseInt(h.slice(i * 2, i * 2 + 2), 16);
        return a;
      };

      const term = new Terminal({
        cursorBlink: true,
        convertEol: false,
        theme: { background: "#1d1f21", foreground: "#c5c8c6" },
      });
      const fit = new FitAddon();
      term.loadAddon(fit);
      term.open(document.getElementById("terminal"));
      fit.fit();

      function connect(token) {
        const wsURL = new URL("ws", location.href);
        wsURL.protocol = location.protocol === "https:" ? "wss:" : "ws:";
        if (token) wsURL.searchParams.set("token", token);
        const ws = new WebSocket(wsURL);
        ws.binaryType = "arraybuffer";
        const enc = new TextEncoder();
        const sendResize = () => {
          if (ws.readyState !== WebSocket.OPEN) return;
          ws.send(
            JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }),
          );
        };
        ws.addEventListener("open", () => {
          setStatus("connected");
          sendResize();
        });
        ws.addEventListener("message", (ev) => {
          if (typeof ev.data === "string") return;
          term.write(new Uint8Array(ev.data));
        });
        ws.addEventListener("close", () => setStatus("disconnected"));
        ws.addEventListener("error", () => setStatus("error", "err"));
        term.onData((s) => {
          if (ws.readyState === WebSocket.OPEN) ws.send(enc.encode(s));
        });
        term.onResize(sendResize);
        window.addEventListener("resize", () => {
          fit.fit();
          sendResize();
        });
      }

      // Detect each wallet by its own injected global (only one can own
      // window.solana), so the user can pick which one signs.
      function detectWallets() {
        const out = [],
          seen = new Set();
        const add = (name, p) => {
          if (p && !seen.has(p)) {
            seen.add(p);
            out.push({ name, p });
          }
        };
        add("Phantom", window.phantom?.solana);
        add("Solflare", window.solflare);
        add(
          "Backpack",
          window.backpack?.solana ??
            (window.backpack?.isBackpack ? window.backpack : null),
        );
        return out;
      }

      // attachToSession: sign the W→K delegation for `session` (null in
      // fixed-session mode, where the gateway names it) and open the WS.
      async function attachToSession(provider, addr, session) {
        const body = { wallet: addr, caps: "write, resize" };
        if (session) body.session = session;
        const prep = await fetch("login/prepare", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!prep.ok) {
          setStatus("prepare failed: " + (await prep.text()), "err");
          return;
        }
        const { token, content_hex } = await prep.json();
        setStatus("approve the delegation in your wallet…");
        const res = await provider.signMessage(hexToBytes(content_hex), "utf8");
        const sig = res.signature ?? res;
        const cb = await fetch("login/callback", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ token, signature_base58: b58(sig) }),
        });
        if (!cb.ok) {
          setStatus("callback failed: " + (await cb.text()), "err");
          return;
        }
        document.getElementById("wallets").innerHTML = "";
        document.getElementById("picker")?.remove();
        active = { provider, addr, session };
        document.getElementById("grant").style.display = "";
        connect(token);
      }

      // grantAccess: off-chain governance — the owner signs an
      // owner→grantee delegation and the gateway returns a blob to hand
      // to the grantee (who runs `mosey attach --wallet-grant <file>`).
      async function grantAccess() {
        if (!active.provider || !active.addr) {
          setStatus("sign in first", "err");
          return;
        }
        const grantee = prompt("Grantee wallet address (base58):");
        if (!grantee) return;
        const caps =
          prompt("Caps (view-only | write, resize | write, resize, forge):", "write, resize") ||
          "view-only";
        try {
          const body = { wallet: active.addr, grantee, caps, expires_seconds: 86400 };
          if (active.session) body.session = active.session;
          const prep = await fetch("grant/prepare", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(body),
          });
          if (!prep.ok) {
            setStatus("grant prepare failed: " + (await prep.text()), "err");
            return;
          }
          const { token, content_hex } = await prep.json();
          setStatus("approve the grant in your wallet…");
          const res = await active.provider.signMessage(hexToBytes(content_hex), "utf8");
          const sig = res.signature ?? res;
          const cb = await fetch("grant/callback", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ token, signature_base58: b58(sig) }),
          });
          if (!cb.ok) {
            setStatus("grant failed: " + (await cb.text()), "err");
            return;
          }
          const { grant_base64 } = await cb.json();
          setStatus("grant created");
          prompt(
            "Grant blob — give this to the grantee (base64; they decode it to a file and run `mosey attach --wallet-grant <file>`):",
            grant_base64,
          );
        } catch (e) {
          setStatus("grant error: " + (e?.message ?? e), "err");
        }
      }
      document.getElementById("grant").addEventListener("click", grantAccess);

      async function walletLogin(cfg) {
        const walletsEl = document.getElementById("wallets");
        if (cfg.session)
          document.getElementById("session").textContent =
            "· " + cfg.session.slice(0, 8) + "…";

        async function signIn(provider) {
          try {
            setStatus("connecting wallet…");
            const resp = await provider.connect();
            const addr = (resp?.publicKey ?? provider.publicKey).toString();
            if (cfg.session) {
              await attachToSession(provider, addr, null); // fixed session
              return;
            }
            // Multi-session: list the wallet's sessions and let it pick.
            setStatus("loading your sessions…");
            const r = await fetch("sessions?wallet=" + encodeURIComponent(addr));
            if (!r.ok) {
              setStatus("list sessions failed: " + (await r.text()), "err");
              return;
            }
            const { sessions } = await r.json();
            walletsEl.innerHTML = "";
            if (!sessions || !sessions.length) {
              setStatus("no sessions found for this wallet", "err");
              return;
            }
            const picker = document.createElement("span");
            picker.id = "picker";
            for (const s of sessions) {
              const btn = document.createElement("button");
              btn.textContent = "Attach · " + s.session.slice(0, 8) + "…";
              btn.onclick = () => attachToSession(provider, addr, s.session);
              picker.appendChild(btn);
            }
            document.querySelector("header").appendChild(picker);
            setStatus("pick a session");
          } catch (e) {
            setStatus("error: " + (e?.message ?? e), "err");
          }
        }

        function render() {
          const found = detectWallets();
          walletsEl.innerHTML = "";
          if (!found.length) {
            setStatus("no Solana wallet found (Phantom / Solflare / Backpack)", "err");
            return;
          }
          setStatus("sign in to attach");
          for (const { name, p } of found) {
            const btn = document.createElement("button");
            btn.textContent = "Sign in · " + name;
            btn.onclick = () => signIn(p);
            walletsEl.appendChild(btn);
          }
        }
        render();
        setTimeout(render, 600); // extensions inject asynchronously
      }

      // Boot: ask the gateway which auth flow to run.
      try {
        const cfg = await (await fetch("config")).json();
        if (cfg.mode === "wallet") {
          await walletLogin(cfg);
        } else {
          connect(); // static auth: gateway holds the credential
        }
      } catch (e) {
        setStatus("config error: " + (e?.message ?? e), "err");
      }
    </script>
  </body>
</html>
